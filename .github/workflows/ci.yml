name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:architecture
      - run: pnpm typecheck:app
      - name: Run affected unit tests
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm test:changed "$BASE_REF"
      - name: Build application without full data audits
        run: pnpm exec vite build
  affected-e2e:
    name: Affected E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run affected browser tests
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm test:e2e:changed "$BASE_REF"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: affected-e2e-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
  check:
    if: always()
    needs: [fast, affected-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require both parallel checks
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          E2E_RESULT: ${{ needs.affected-e2e.result }}
        run: test "$FAST_RESULT" = success && test "$E2E_RESULT" = success
  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run the full release gate
        run: BASE_PATH=/${{ github.event.repository.name }}/ pnpm check:full
      - name: Verify generated schemas are committed
        run: git diff --exit-code -- schemas/
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
